<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">DYNAMIXEL pinout, TTL servo</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">hook the driver uses for it. Datasheet: 4.5 Connector Information, p. 1.</text>
