<text x="380" y="293.6" font-size="13" text-anchor="middle" fill="#9AA6B5">TTL servo, top view</text>
<text x="235" y="249.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#E2E8F0">1</text>
