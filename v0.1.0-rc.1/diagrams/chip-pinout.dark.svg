<svg xmlns="http://www.w3.org/2000/svg" width="760" height="441" viewBox="0 0 760 441" role="img" aria-labelledby="chip-pinout-title chip-pinout-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-pinout-title">DYNAMIXEL pinout, TTL servo</title>
<desc id="chip-pinout-desc">Pinout of the DYNAMIXEL in TTL servo, top view: 3 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
