---
# The servo's hardware in one file: connector, pins, the driver hook of each pin, the blocks inside and the reference
# circuits. `kokeb-docs figures` draws the pinout, the outline, the block diagram and the circuits from it,
# `kokeb-docs gen` writes the chip card of the README and the tables of docs/hardware.md, and
# `kokeb-docs hardware --check` validates it. Schema: docs/chip-diagrams.md in kokeb-labs/ci-tools.
#
# The driver talks to a whole family of servos, not to one chip. The reference part is the XM430-W350, the X-series
# servo whose e-Manual page the driver follows for the control table and the connector; the other families differ in
# the connector housing and the supply range (docs/control-tables.md lists them). The part is a servo module with a
# JST EH connector, not a leaded package: the figure system draws it as a body with the connector pins in one row,
# and the outline gets the module's width and height. The 3-pin TTL connector is the one drawn; the 4-pin RS-485
# variant has the same pins 1 and 2 and splits the data line into DATA+ and DATA- (pin 3 and 4).
# The e-Manual has no block diagram: the blocks below are the ones its specification table names (MCU, encoder,
# motor) and are marked `unverified` where the page does not draw them.
schema: 1
chip: DYNAMIXEL

refs:
  pinout: {doc: xm430, section: "4.5 Connector Information", page: 1}
  spec: {doc: xm430, section: "1 Specifications", page: 1}
  circuit: {doc: xm430, section: "4.6 Communication Circuit", page: 1}
  duplex: {doc: p2, section: "1.4 Half Duplex; 1.5 Tx, Rx Direction", page: 1}
  gap: {doc: p2, section: "1.6 Byte to Byte Time", page: 1}
  drawing: {doc: xm430, section: "4.7 Drawings", page: 1}
  opmode: {doc: xm430, section: "2.4 Control Table Description, Operating Mode(11)", page: 1}
  ident: {doc: xm430, section: "2.4 Control Table Description, ID(7) and Baud Rate(8)", page: 1}
  torque: {doc: xm430, section: "2.4 Control Table Description, Torque Enable(64)", page: 1}
  hwerr: {doc: xm430, section: "2.4 Control Table Description, Hardware Error Status(70)", page: 1}
  profile: {doc: xm430, section: "2.4 Control Table Description, Profile Velocity(112)", page: 1}
  goalpos: {doc: xm430, section: "2.4 Control Table Description, Goal Position(116)", page: 1}
  present: {doc: xm430, section: "2.4 Control Table Description, Present Position(132)", page: 1}
  ping: {doc: p2, section: "5.1 Ping (0x01)", page: 1}
  sync: {doc: p2, section: "5.10 Sync Read (0x82)", page: 1}
  reset: {doc: p2, section: "5.6 Factory Reset (0x06)", page: 1}
  p2idnote: {doc: p2, section: "1.2 ID", page: 1}
  p2proto: {doc: p2, section: "1.3 DYNAMIXEL Protocol", page: 1}
  p2pkt: {doc: p2, section: "2 Instruction Packet", page: 1}
  p2id: {doc: p2, section: "2.3 Packet ID", page: 1}
  p2len: {doc: p2, section: "2.4 Length", page: 1}
  p2crc: {doc: p2, section: "2.7 CRC", page: 1}
  p2status: {doc: p2, section: "3 Status Packet", page: 1}
  p1pkt: {doc: p1, section: "2 Instruction Packet", page: 1}
  p1id: {doc: p1, section: "2.2 Packet ID", page: 1}
  p1gap: {doc: p1, section: "1.6 Byte to Byte Time", page: 1}

package:
  type: "TTL servo"
  pins: 3
  layout: dual
  sides: {left: [1, 2, 3]}
  ref: pinout
  outline: {length_mm: 28.5, width_mm: 46.5, height_mm: 34, pitch_mm: 2.5, ref: spec, pitch_ref: pinout}
  variants:
    - {id: rs485, type: "RS-485 servo", pins: 4,
       size: "28.5 x 46.5 x 34 mm, 82 g", ordering: "XM430-W350 (RS-485 port)",
       note: "pin 3 DATA+, pin 4 DATA-; JST EHR-04", ref: pinout}

supply:
  - {name: VDD, min_v: 10.0, max_v: 14.8, ref: spec}

# The chip-first README: what a servo is and does, where it is used, how the driver covers each function. The
# reference part is the XM430-W350; the driver covers the control tables of 47 models. The bus is a variable-length
# packet exchange, so there is no `frames` entry.
overview:
  summary: >-
    a family of smart servo actuators: each one has a motor, a gearbox, an absolute position sensor and a controller
    that runs its position, velocity or current loop, and all of them share one half-duplex data line, each with its
    own ID
  category: Smart servo actuator
  ref: spec
  applications_ref: opmode
  applications:
    - Articulated robot joints
    - Wheel-type robots
    - Grippers
    - Multi-turn wrists and conveyor systems
  specs:
    - {value: "10 to 14.8 V", label: "XM430-W350 supply, 12 V recommended", ref: spec}
    - {value: "4096 / rev", label: "position resolution, 12 bit", ref: spec}
    - {value: "4.5 Mbit/s", label: "fastest baud rate, from 9600", ref: spec}
    - {value: "253 IDs", label: "on one bus, 0 to 252", ref: spec}
    - {value: "4.1 N.m", label: "stall torque at 12 V", ref: spec}
  system:
    host: MCU
    bus: "TTL or RS-485"
    drives:
      - {label: "Motor and gear", detail: "coreless motor, 353.5 : 1", ref: spec}
    senses:
      - {label: Absolute encoder, detail: "12 bit, 360 degrees", ref: spec}
      - {label: "Temperature, voltage, current", detail: "reported as feedback", ref: spec}

# Headers the capability `api` and `registers` names are checked against.
driver:
  api: [inc/dynamixel.hpp, inc/dynamixel_types.hpp]
  registers: [inc/dynamixel_tables.hpp]

capabilities:
  - {id: position, title: Position control, icon: motion, status: supported, ref: goalpos, docs: control-tables.md,
     what: "Moves to a goal position in counts, within the position limits and the profile velocity and acceleration",
     api: [SetGoalPosition, WriteRegister],
     registers: [GoalPosition, MinPositionLimit, MaxPositionLimit, ProfileVelocity, ProfileAcceleration]}
  - {id: modes, title: "Velocity, current and PWM modes", icon: current, status: supported, ref: opmode,
     docs: control-tables.md,
     what: "Selects the operating mode and sets a velocity, current or PWM goal, by register name with units",
     note: "no motion helper: written through the register calls",
     api: [WriteRegister, ReadRegister],
     registers: [OperatingMode, GoalVelocity, GoalCurrent, GoalPwm]}
  - {id: feedback, title: Feedback, icon: gauge, status: supported, ref: present, docs: control-tables.md,
     what: "Reads position, velocity, load or current, voltage and temperature in one call",
     api: [ReadFeedback, ReadRegister],
     registers: [PresentPosition, PresentVelocity, PresentCurrent, PresentVoltage, PresentTemperature]}
  - {id: torque, title: Torque enable, icon: stop, status: supported, ref: torque, docs: api-guide.md,
     what: "Switches the motor on or off; the torque-off stop is always available, even with guards on",
     api: [SetTorque, DisableTorque, DisableTorqueAll, DisableTorqueEach], registers: [TorqueEnable]}
  - {id: scan, title: Find servos, icon: tag, status: supported, ref: ping, docs: protocol.md,
     what: "Pings one ID or the whole bus, and reads each servo's model number and firmware",
     api: [Ping, BroadcastPing, ScanIds, Identify], registers: [ModelNumber, FirmwareVersion]}
  - {id: multi, title: Many servos at once, icon: chain, status: supported, ref: sync, docs: protocol.md,
     what: "Reads or writes the same registers of many servos in one transaction, with an outcome for each servo",
     api: [SyncRead, SyncWrite, BulkRead, BulkWrite, FastSyncRead, FastBulkRead]}
  - {id: config, title: "ID, baud rate and status level", icon: settings, status: supported, ref: ident,
     docs: api-guide.md,
     what: "Gives a servo its ID and baud rate, moves the bus to match, and sets which replies a servo returns",
     api: [SetId, SetServoBaudRate, ChangeBusBaud, SetStatusReturnLevel],
     registers: [Id, BaudRate, StatusReturnLevel]}
  - {id: reset, title: "Reboot, reset and backup", icon: lock, status: guarded, ref: reset, docs: protocol.md,
     what: "Reboots a servo, resets its control table, clears the multi-turn count and stores or restores a backup",
     note: "destructive instructions need one configuration flag",
     api: [Reboot, FactoryReset, Clear, Backup]}
  - {id: alerts, title: Hardware errors, icon: alert, status: supported, ref: hwerr, docs: protocol.md,
     what: "Decodes the error byte and the hardware error status, and latches an alert until it is cleared",
     api: [GetLatchedAlert, ClearLatchedAlert, Resync], registers: [HardwareErrorStatus, Shutdown]}

hooks:
  - {id: tx, call: "Write()", kind: uart, source: inc/dynamixel_uart_interface.hpp, symbol: UartInterface}
  - {id: rx, call: "Read()", kind: uart, source: inc/dynamixel_uart_interface.hpp, symbol: UartInterface}

pins:
  - {number: 1, name: GND, type: ground, function: "Ground and the negative supply (pin 1 of the connector)",
     ref: pinout}
  - {number: 2, name: VDD, type: power, domain: VDD,
     function: "Positive supply, 10.0 V to 14.8 V, 12.0 V recommended (XM430-W350)", ref: spec}
  - {number: 3, name: DATA, type: open-drain, domain: "TTL, 5 V in the circuit",
     function: "Half-duplex TTL data line, 8N1: the master and every servo share it. The master's TX and RX meet here
       (single wire), so a sent byte is also read back unless the adapter gates it. The page text gives no voltage
       level; the circuit figure shows a 10 kOhm pull-up to 5 V. Unverified: the drive type (open drain) is not stated",
     hook: tx, ref: pinout}

block_diagram:
  ref: spec
  blocks:
    - {id: line, ref: duplex, label: "Half-duplex line", detail: "TTL or RS-485, 9600 to 4.5 Mbit/s", at: [0, 0],
       tone: blue, pins: [DATA]}
    - {id: mcu, ref: spec, label: "MCU and control table", detail: "ARM Cortex-M3, EEPROM and RAM registers",
       at: [1, 0], tone: slate, unverified: "the e-Manual has no block diagram: named from its specification table"}
    - {id: enc, ref: spec, label: "Absolute encoder", detail: "12 bit, 360 degrees", at: [2, 0], tone: teal,
       unverified: "the e-Manual has no block diagram: named from its specification table"}
    - {id: motor, ref: spec, label: "Motor and gear", detail: "coreless motor, 353.5 : 1", at: [2, 1], tone: amber,
       unverified: "the e-Manual has no block diagram: named from its specification table"}
    - {id: pwr, ref: spec, label: "Supply", detail: "10.0 V to 14.8 V", at: [0, 1], tone: slate, pins: [VDD, GND]}
  links:
    - {from: line, to: mcu, label: "packets", both: true}
    - {from: enc, to: mcu, label: position}
    - {from: mcu, to: motor, label: drive}
    - {from: pwr, to: mcu, label: power}

circuits:
  - id: typical
    title: servo bus on an MCU's UART through a half-duplex stage
    description: >-
      The e-Manual's recommended circuit (a figure only: it is not in the page text): a 74LVC2G241 pair of tri-state
      buffers on 5 V joins the MCU's UART TX and RX to the servos' single DATA line. One direction pin drives both
      enables: high enables the transmit buffer (TXD to DATA), low the receive buffer (DATA to RXD). Write() raises
      it while it sends. 10 kOhm pull-ups to 5 V hold RXD and DATA, and a 10 kOhm pull-down keeps the direction pin
      low (listening) while the MCU pin is not driven. The page says the circuit is designed for a 5 V or 5 V
      tolerant MCU: a 3.3 V MCU needs a level shifter. Every servo on the bus is wired in parallel: GND, VDD and
      DATA, with its own supply.
    ref: circuit
    parts:
      - {id: U1, kind: chip}
      - id: U2
        kind: mcu
        label: MCU (5 V)
        pins:
          - {name: TXD, label: UART TX}
          - {name: RXD, label: UART RX}
          - {name: DIR, label: GPIO (direction)}
          - VDD
          - GND
      - id: U3
        kind: ic
        label: 74LVC2G241 buffers
        pins: [VCC, 2A, 1Y, 1OE, 2OE, 2Y, 1A, GND]
        unverified: "the part is read from the e-Manual's circuit figure; the pin names are the 74LVC2G241's own"
      - {id: R1, kind: resistor, value: 10 kΩ, unverified: "the DATA pull-up of the e-Manual's circuit figure"}
      - {id: R2, kind: resistor, value: 10 kΩ, unverified: "the RXD pull-up of the e-Manual's circuit figure"}
      - {id: R3, kind: resistor, value: 10 kΩ,
         unverified: "the direction pull-down of the e-Manual's circuit figure; never a pull-up"}
      - {id: C1, kind: capacitor, value: 100 µF, unverified: "an example bulk capacitor at the servo supply, not an e-Manual value"}
    nets:
      - {name: "+12V", kind: supply, nodes: [U1.VDD, C1.1]}
      - {name: "+5V", kind: supply, nodes: [U2.VDD, U3.VCC, R1.1, R2.1]}
      - {name: GND, kind: ground, nodes: [U1.GND, C1.2, U2.GND, U3.GND, R3.2]}
      - {name: TXD, nodes: [U2.TXD, U3.2A], hook: tx}
      - {name: RXD, nodes: [U3.1Y, U2.RXD, R2.2], hook: rx}
      - {name: TX_Enable, nodes: [U2.DIR, U3.1OE, U3.2OE, R3.1], hook: tx}
      - {name: DATA, nodes: [U3.2Y, U3.1A, U1.DATA, R1.2], hook: [tx, rx]}
