<rect x="32" y="435.6" width="440.4" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="443.6" width="4" height="58" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="531.6" width="576" height="152.1" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="52" y="215.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="242.8" font-size="15" class="fk-f-ink2">UART with a half-duplex direction switch</text>
<text x="52" y="307.1" font-size="17" font-weight="700" class="fk-f-teal-text">Servo</text>
<text x="52" y="334.8" font-size="15" class="fk-f-ink2">ID 1</text>
<text x="52" y="399.1" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="464.1" font-size="17" font-weight="700" class="fk-f-teal-text">Servo</text>
<text x="52" y="491.8" font-size="15" class="fk-f-ink2">ID up to 252</text>
<text x="525.8" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">DATA</text>
<circle cx="525.8" cy="202.6" r="3.6" class="fk-f-ink2"/>
<circle cx="525.8" cy="294.6" r="3.6" class="fk-f-ink2"/>
<circle cx="525.8" cy="394.1" r="3.6" class="fk-f-ink2"/>
<circle cx="525.8" cy="451.6" r="3.6" class="fk-f-ink2"/>
<text x="580.6" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">GND</text>
<circle cx="580.6" cy="212.6" r="3.6" class="fk-f-ink2"/>
<circle cx="580.6" cy="304.6" r="3.6" class="fk-f-ink2"/>
<circle cx="580.6" cy="394.1" r="3.6" class="fk-f-ink2"/>
<circle cx="580.6" cy="461.6" r="3.6" class="fk-f-ink2"/>
<text x="46" y="560.1" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="580.5" font-size="15" class="fk-f-slate-text">IDs 0 to 252 in protocol 2.0, 0 to 253 in protocol 1.0; 254 is the</text>
<text x="46" y="602.2" font-size="15" class="fk-f-slate-text">broadcast ID (2.3, p. 1). Every servo on the bus needs a unique ID; a new</text>
<text x="46" y="624" font-size="15" class="fk-f-slate-text">servo has ID 1 (1.2, p. 1). A broadcast packet returns status only for Ping,</text>
<text x="46" y="645.8" font-size="15" class="fk-f-slate-text">Sync Read and Bulk Read (2.3, p. 1). TTL connector: 1 GND, 2 VDD, 3</text>
<text x="46" y="667.5" font-size="15" class="fk-f-slate-text">DATA (4.5, p. 1).</text>
</svg>
