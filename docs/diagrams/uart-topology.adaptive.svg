<rect x="32" y="194.6" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="32" y="278.6" width="440.4" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
