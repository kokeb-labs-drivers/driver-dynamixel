<rect x="0.5" y="0.5" width="639" height="713" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL SERVOS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Servos on one DATA line</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Sources: p2 2.3 Packet ID, p. 1; p2 1.2 ID, p. 1; xm430 4.5 Connector</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">Information, p. 1.</text>
