<svg xmlns="http://www.w3.org/2000/svg" width="640" height="714" viewBox="0 0 640 714" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-topology-title">Servos on one DATA line</title>
<desc id="uart-topology-desc">A DYNAMIXEL multidrop bus on which the MCU and several servos share one half-duplex DATA line and ground, each servo answering to its own ID, and the broadcast ID reaching all of them.</desc>
<style>
