<text x="280" y="528.8" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#E8EDF3">GND</text>
<text x="44" y="477.8" font-size="15" font-weight="700" fill="#E8EDF3">MCU + buffer</text>
<text x="44" y="495.8" font-size="12" fill="#9AA6B5">U2</text>
<text x="512" y="342.8" font-size="12" font-weight="700" text-anchor="middle" fill="#FECDD3">+12V</text>
<text x="575" y="404.8" font-size="12" font-weight="700" fill="#E8EDF3">C1</text>
<text x="575" y="419.2" font-size="12" fill="#9AA6B5">100 µF *</text>
<text x="336" y="497.8" font-size="12" font-weight="500" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#BFDBFE">Write()</text>
<circle cx="512" cy="383.8" r="3.2" fill="#D2DAE4"/>
<text x="32" y="612.8" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: C1 100 µF: an example bulk capacitor at the servo supply, not an e-Manual</text>
<text x="32" y="630.8" font-size="12.5" fill="#9AA6B5">value.</text>
