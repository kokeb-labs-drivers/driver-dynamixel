<text x="32" y="827.5" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: U3: the part is read from the e-Manual's circuit figure; the pin names are the 74LVC2G241's own; R1 10 kΩ: the DATA pull-up of</text>
<text x="32" y="845.5" font-size="12.5" fill="#9AA6B5">the e-Manual's circuit figure; R2 10 kΩ: the RXD pull-up of the e-Manual's circuit figure; R3 10 kΩ: the direction pull-down of the e-Manual's circuit figure; never a</text>
