<svg xmlns="http://www.w3.org/2000/svg" width="760" height="696" viewBox="0 0 760 696" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">DYNAMIXEL: servo bus on an MCU's UART through a half-duplex stage</title>
<desc id="chip-circuit-typical-desc">Schematic of the DYNAMIXEL servo bus on an mcu's uart through a half-duplex stage: the chip with U2 MCU + buffer, C1 capacitor 100 µF; the MCU wires carry the port hooks Write().</desc>
<rect x="0.5" y="0.5" width="759" height="695" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">DYNAMIXEL: servo bus on an MCU's UART through a half-duplex stage</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The MCU's UART TX and RX are joined to the servos' single DATA line by a half-duplex</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">stage (the recommended circuit of the e-Manual: a tri-state buffer pair with a direction pin,</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">or the UART's own half-duplex mode). Every servo on the bus is wired in parallel: GND, VDD</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">and DATA. The servos take their power from their own supply, not from the MCU. The stage</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">is drawn with the MCU, as one part: the e-Manual's circuit (a figure only: it is not in the page</text>
<text x="32" y="212.6" font-size="15" fill="#9AA6B5">text) is a 74LVC2G241 tri-state buffer pair on a 5 V supply with 10 kOhm pull-ups on RXD</text>
<text x="32" y="234.3" font-size="15" fill="#9AA6B5">and DATA and a 10 kOhm pull-down on the direction line, and the page says it is designed</text>
<text x="32" y="256.1" font-size="15" fill="#9AA6B5">for a 5 V or 5 V tolerant MCU: a 3.3 V MCU needs a level shifter. Above each MCU wire: the</text>
<text x="32" y="277.8" font-size="15" fill="#9AA6B5">port hook that drives it. Datasheet: 4.6 Communication Circuit, p. 1.</text>
<rect x="32" y="293.8" width="696" height="1" fill="#252F3C"/>
