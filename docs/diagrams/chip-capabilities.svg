<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1068" viewBox="0 0 1200 1068" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the DYNAMIXEL does</title>
<desc id="chip-capabilities-desc">Capability map of the DYNAMIXEL: Position control (supported): Moves to a goal position in counts, within the position limits and the profile velocity and acceleration; Velocity, current and PWM modes (supported): Selects the operating mode and sets a velocity, current or PWM goal, by register name with units; Feedback (supported): Reads position, velocity, load or current, voltage and temperature in one call; Torque enable (supported): Switches the motor on or off; the torque-off stop is always available, even with guards on; Find servos (supported): Pings one ID or the whole bus, and reads each servo's model number and firmware; Many servos at once (supported): Reads or writes the same registers of many servos in one transaction, with an outcome for each servo; ID, baud rate and status level (supported): Gives a servo its ID and baud rate, moves the bus to match, and sets which replies a servo returns; Reboot, reset and backup (guarded): Reboots a servo, resets its control table, clears the multi-turn count and stores or restores a backup; Hardware errors (supported): Decodes the error byte and the hardware error status, and latches an alert until it is cleared.</desc>
