<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="955" viewBox="0 0 1200 955" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: servo bus on an MCU's UART through a half-duplex stage</title>
<desc id="chip-wiring-typical-desc">Wiring of the DYNAMIXEL for the servo bus on an MCU's UART through a half-duplex stage: MCU (5 V) UART TX to 74LVC2G241 buffers 2A (Write()); MCU (5 V) UART RX to 74LVC2G241 buffers 1Y (Read()); MCU (5 V) GPIO (direction) to 74LVC2G241 buffers 1OE, 2OE (Write()); 74LVC2G241 buffers 2Y, 1A to DATA (Write() and Read()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="954" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: servo bus on an MCU's UART through a half-duplex stage</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: 4.6 Communication Circuit, p. 1.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
<path d="M342.2 321.9 L484 321.9" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M342.2 429.1 L484 429.1" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M342.2 536.3 L484 536.3" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M691 321.9 L818.8 321.9" fill="none" stroke="#FBBF24" stroke-width="2.2"/>
<rect x="832.8" y="175.5" width="240" height="440.4" rx="10" fill="#18202B" stroke="#D2DAE4" stroke-width="2.2"/>
<rect x="127.2" y="175.5" width="215" height="440.4" rx="12" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="484" y="268.3" width="207" height="321.6" rx="12" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="32" y="643.9" width="1136" height="79" rx="12" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<rect x="32" y="736.9" width="1136" height="79" rx="12" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="952.8" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">DYNAMIXEL</text>
<text x="952.8" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="145.2" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">MCU (5 V)</text>
<text x="145.2" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="484" y="258.3" font-size="16" font-weight="700" fill="#DDD6FE">74LVC2G241 buffers</text>
<text x="324.2" y="327.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">UART TX</text>
<text x="502" y="327.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#DDD6FE">2A</text>
<text x="413.1" y="311.9" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">TXD</text>
<text x="413.1" y="344.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write()</text>
<text x="324.2" y="434.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">UART RX</text>
<text x="502" y="434.9" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#DDD6FE">1Y</text>
<text x="413.1" y="419.1" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">RXD</text>
<text x="413.1" y="451.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Read()</text>
<text x="413.1" y="473.5" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R2 10 kΩ</text>
<text x="324.2" y="542.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">GPIO (direction)</text>
<text x="502" y="542.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#DDD6FE">1OE, 2OE</text>
<text x="413.1" y="526.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">TX_Enable</text>
<text x="413.1" y="559.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write()</text>
<text x="413.1" y="580.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R3 10 kΩ</text>
<text x="673" y="327.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#DDD6FE">2Y, 1A</text>
<text x="854.8" y="327.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DATA</text>
<rect x="818.8" y="315.9" width="14" height="12" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="754.9" y="311.9" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">DATA  pin 3</text>
<text x="754.9" y="344.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write()</text>
<text x="754.9" y="366.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Read()</text>
<text x="754.9" y="387.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R1 10 kΩ</text>
<text x="50" y="678.9" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="702.4" font-size="17" fill="#FECDD3">+12V: VDD · +5V (no DYNAMIXEL pin): U2.VDD, U3.VCC · GND: GND; also U2.GND, U3.GND</text>
<text x="50" y="771.9" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="795.4" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 3 resistors around the supplies (values in the full schematic).</text>
<text x="32" y="841.4" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: U3: the part is read from the e-Manual's circuit figure; the pin names are the 74LVC2G241's own; R1: the</text>
<text x="32" y="864.4" font-size="16" fill="#9AA6B5">DATA pull-up of the e-Manual's circuit figure; R2: the RXD pull-up of the e-Manual's circuit figure; R3: the direction pull-down of the</text>
<text x="32" y="887.5" font-size="16" fill="#9AA6B5">e-Manual's circuit figure; never a pull-up; C1: an example bulk capacitor at the servo supply, not an e-Manual value.</text>
<rect x="32" y="904.7" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="54" y="919.3" font-size="16" fill="#9AA6B5">open drain</text>
</svg>
