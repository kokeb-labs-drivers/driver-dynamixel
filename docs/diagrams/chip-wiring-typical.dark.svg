<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: servo bus on an MCU's UART through a half-duplex stage</title>
<desc id="chip-wiring-typical-desc">Wiring of the DYNAMIXEL for the servo bus on an MCU's UART through a half-duplex stage: MCU + buffer UART TX and RX to DATA (Write()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="611" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: servo bus on an MCU's UART through a half-duplex stage</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: 4.6 Communication Circuit, p. 1.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
<path d="M505.6 269.5 L640.4 269.5" fill="none" stroke="#FBBF24" stroke-width="2.2"/>
<rect x="654.4" y="175.5" width="240" height="144" rx="10" fill="#18202B" stroke="#D2DAE4" stroke-width="2.2"/>
<rect x="305.6" y="175.5" width="200" height="144" rx="12" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="347.5" width="1136" height="79" rx="12" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<rect x="32" y="440.5" width="1136" height="79" rx="12" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="774.4" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">DYNAMIXEL</text>
<text x="774.4" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="323.6" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">MCU + buffer</text>
<text x="323.6" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="487.6" y="275.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">UART TX and RX</text>
<text x="676.4" y="275.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DATA</text>
<rect x="640.4" y="263.5" width="14" height="12" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="573" y="259.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">DATA  pin 3</text>
<text x="573" y="292.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write()</text>
<text x="50" y="382.5" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="405.9" font-size="17" fill="#FECDD3">+12V: VDD · GND: GND; also U2.GND</text>
<text x="50" y="475.5" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="498.9" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor around the supplies (values in the full schematic).</text>
<text x="32" y="545" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: C1: an example bulk capacitor at the servo supply, not an e-Manual value.</text>
