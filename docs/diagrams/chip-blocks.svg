<text x="524" y="272.2" font-size="13" fill="#2B3442">RAM registers</text>
<text x="868" y="228.6" font-size="15" font-weight="700" fill="#0B5F59">Absolute encoder*</text>
<text x="868" y="253.4" font-size="13" fill="#2B3442">12 bit, 360 degrees</text>
<text x="868" y="364.6" font-size="15" font-weight="700" fill="#8A3C0B">Motor and gear*</text>
<text x="868" y="389.4" font-size="13" fill="#2B3442">coreless motor, 353.5 : 1</text>
<text x="180" y="364.6" font-size="15" font-weight="700" fill="#334155">Supply</text>
<text x="180" y="389.4" font-size="13" fill="#2B3442">10.0 V to 14.8 V</text>
