<text x="136" y="162.8" font-size="13" font-weight="700" fill="#334155">DYNAMIXEL</text>
<text x="231.9" y="162.8" font-size="12" fill="#334155">TTL servo</text>
<text x="180" y="228.6" font-size="15" font-weight="700" fill="#1E429F">Half-duplex line</text>
<text x="180" y="253.4" font-size="13" fill="#2B3442">TTL or RS-485, 9600 to 4.5</text>
<text x="180" y="272.2" font-size="13" fill="#2B3442">Mbit/s</text>
<text x="524" y="228.6" font-size="15" font-weight="700" fill="#334155">MCU and control table*</text>
