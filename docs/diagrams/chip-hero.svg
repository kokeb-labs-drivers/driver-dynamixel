<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="842" viewBox="0 0 1200 842" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">DYNAMIXEL</title>
<desc id="chip-hero-desc">Overview of the DYNAMIXEL, a family of smart servo actuators: each one has a motor, a gearbox, an absolute position sensor and a controller that runs its position, velocity or current loop, and all of them share one half-duplex data line, each with its own ID. A MCU talks to it over TTL or RS-485; it drives Motor and gear; it reads back Absolute encoder, Temperature, voltage, current. Headline figures: 10 to 14.8 V XM430-W350 supply, 12 V recommended; 4096 / rev position resolution, 12 bit; 4.5 Mbit/s fastest baud rate, from 9600; 253 IDs on one bus, 0 to 252; 4.1 N.m stall torque at 12 V.</desc>
