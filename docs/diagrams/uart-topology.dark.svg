<svg xmlns="http://www.w3.org/2000/svg" width="640" height="714" viewBox="0 0 640 714" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-topology-title">Servos on one DATA line</title>
<desc id="uart-topology-desc">A DYNAMIXEL multidrop bus on which the MCU and several servos share one half-duplex DATA line and ground, each servo answering to its own ID, and the broadcast ID reaching all of them.</desc>
<rect x="0.5" y="0.5" width="639" height="713" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL SERVOS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Servos on one DATA line</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Sources: p2 2.3 Packet ID, p. 1; p2 1.2 ID, p. 1; xm430 4.5 Connector</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Information, p. 1.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#252F3C"/>
<path d="M525.8 194.6 L525.8 501.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M472.4 202.6 L525.8 202.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M472.4 294.6 L525.8 294.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M472.4 394.1 L525.8 394.1" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M472.4 451.6 L525.8 451.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M580.6 194.6 L580.6 501.6" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M472.4 212.6 L580.6 212.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M472.4 304.6 L580.6 304.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M472.4 394.1 L580.6 394.1" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M472.4 461.6 L580.6 461.6" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<rect x="32" y="186.6" width="440.4" height="74" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="194.6" width="4" height="58" rx="2" fill="#60A5FA"/>
<rect x="32" y="278.6" width="440.4" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="286.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="370.6" width="440.4" height="47" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="435.6" width="440.4" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="443.6" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="531.6" width="576" height="152.1" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="215.1" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="242.8" font-size="15" fill="#D2DAE4">UART with a half-duplex direction switch</text>
<text x="52" y="307.1" font-size="17" font-weight="700" fill="#A7F3E6">Servo</text>
<text x="52" y="334.8" font-size="15" fill="#D2DAE4">ID 1</text>
<text x="52" y="399.1" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="464.1" font-size="17" font-weight="700" fill="#A7F3E6">Servo</text>
<text x="52" y="491.8" font-size="15" fill="#D2DAE4">ID up to 252</text>
<text x="525.8" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">DATA</text>
<circle cx="525.8" cy="202.6" r="3.6" fill="#D2DAE4"/>
<circle cx="525.8" cy="294.6" r="3.6" fill="#D2DAE4"/>
<circle cx="525.8" cy="394.1" r="3.6" fill="#D2DAE4"/>
<circle cx="525.8" cy="451.6" r="3.6" fill="#D2DAE4"/>
<text x="580.6" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">GND</text>
<circle cx="580.6" cy="212.6" r="3.6" fill="#D2DAE4"/>
<circle cx="580.6" cy="304.6" r="3.6" fill="#D2DAE4"/>
<circle cx="580.6" cy="394.1" r="3.6" fill="#D2DAE4"/>
<circle cx="580.6" cy="461.6" r="3.6" fill="#D2DAE4"/>
<text x="46" y="560.1" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="580.5" font-size="15" fill="#E2E8F0">IDs 0 to 252 in protocol 2.0, 0 to 253 in protocol 1.0; 254 is the</text>
<text x="46" y="602.2" font-size="15" fill="#E2E8F0">broadcast ID (2.3, p. 1). Every servo on the bus needs a unique ID; a new</text>
<text x="46" y="624" font-size="15" fill="#E2E8F0">servo has ID 1 (1.2, p. 1). A broadcast packet returns status only for Ping,</text>
<text x="46" y="645.8" font-size="15" fill="#E2E8F0">Sync Read and Bulk Read (2.3, p. 1). TTL connector: 1 GND, 2 VDD, 3</text>
<text x="46" y="667.5" font-size="15" fill="#E2E8F0">DATA (4.5, p. 1).</text>
</svg>
