<title id="one-call-through-the-layers-title">One call through the layers</title>
<desc id="one-call-through-the-layers-desc">One call through the layers: your code calls ReadRegister({1, X430}, PresentPosition), the core exchanges frames with the chip through your port and returns the result to your code.</desc>
