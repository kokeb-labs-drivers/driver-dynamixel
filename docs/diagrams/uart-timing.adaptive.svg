<svg xmlns="http://www.w3.org/2000/svg" width="640" height="721" viewBox="0 0 640 721" role="img" aria-labelledby="uart-timing-title uart-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-timing-title">Bytes on the DATA line</title>
<desc id="uart-timing-desc">Two bytes on the half-duplex DATA line of a DYNAMIXEL bus: a start bit, eight data bits and one stop bit with no parity, and the longest gap allowed between the bytes of one instruction packet.</desc>
