<svg xmlns="http://www.w3.org/2000/svg" width="640" height="714" viewBox="0 0 640 714" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-topology-title">Servos on one DATA line</title>
<desc id="uart-topology-desc">A DYNAMIXEL multidrop bus on which the MCU and several servos share one half-duplex DATA line and ground, each servo answering to its own ID, and the broadcast ID reaching all of them.</desc>
<rect x="0.5" y="0.5" width="639" height="713" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">SEVERAL SERVOS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Servos on one DATA line</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Sources: p2 2.3 Packet ID, p. 1; p2 1.2 ID, p. 1; xm430 4.5 Connector</text>
<text x="32" y="124.5" font-size="15" fill="#566070">Information, p. 1.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#E2E7EE"/>
<path d="M525.8 194.6 L525.8 501.6" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M472.4 202.6 L525.8 202.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M472.4 294.6 L525.8 294.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M472.4 394.1 L525.8 394.1" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M472.4 451.6 L525.8 451.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M580.6 194.6 L580.6 501.6" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M472.4 212.6 L580.6 212.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M472.4 304.6 L580.6 304.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M472.4 394.1 L580.6 394.1" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M472.4 461.6 L580.6 461.6" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<rect x="32" y="186.6" width="440.4" height="74" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="194.6" width="4" height="58" rx="2" fill="#2563EB"/>
<rect x="32" y="278.6" width="440.4" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="286.6" width="4" height="58" rx="2" fill="#0B7A72"/>
<rect x="32" y="370.6" width="440.4" height="47" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="435.6" width="440.4" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="443.6" width="4" height="58" rx="2" fill="#0B7A72"/>
<rect x="32" y="531.6" width="576" height="152.1" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="215.1" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="242.8" font-size="15" fill="#2B3442">UART with a half-duplex direction switch</text>
<text x="52" y="307.1" font-size="17" font-weight="700" fill="#0B5F59">Servo</text>
<text x="52" y="334.8" font-size="15" fill="#2B3442">ID 1</text>
<text x="52" y="399.1" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="464.1" font-size="17" font-weight="700" fill="#0B5F59">Servo</text>
<text x="52" y="491.8" font-size="15" fill="#2B3442">ID up to 252</text>
<text x="525.8" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">DATA</text>
<circle cx="525.8" cy="202.6" r="3.6" fill="#2B3442"/>
<circle cx="525.8" cy="294.6" r="3.6" fill="#2B3442"/>
<circle cx="525.8" cy="394.1" r="3.6" fill="#2B3442"/>
<circle cx="525.8" cy="451.6" r="3.6" fill="#2B3442"/>
<text x="580.6" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">GND</text>
<circle cx="580.6" cy="212.6" r="3.6" fill="#2B3442"/>
<circle cx="580.6" cy="304.6" r="3.6" fill="#2B3442"/>
<circle cx="580.6" cy="394.1" r="3.6" fill="#2B3442"/>
<circle cx="580.6" cy="461.6" r="3.6" fill="#2B3442"/>
<text x="46" y="560.1" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="580.5" font-size="15" fill="#334155">IDs 0 to 252 in protocol 2.0, 0 to 253 in protocol 1.0; 254 is the</text>
<text x="46" y="602.2" font-size="15" fill="#334155">broadcast ID (2.3, p. 1). Every servo on the bus needs a unique ID; a new</text>
<text x="46" y="624" font-size="15" fill="#334155">servo has ID 1 (1.2, p. 1). A broadcast packet returns status only for Ping,</text>
<text x="46" y="645.8" font-size="15" fill="#334155">Sync Read and Bulk Read (2.3, p. 1). TTL connector: 1 GND, 2 VDD, 3</text>
<text x="46" y="667.5" font-size="15" fill="#334155">DATA (4.5, p. 1).</text>
</svg>
