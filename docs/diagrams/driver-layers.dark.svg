<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">DYNAMIXEL, inc/dynamixel.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="717.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="748.2" font-size="17" fill="#D2DAE4">UartInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="870.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="899.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Write()  Read()  FlushInput()  DelayUs()</text>
<text x="56" y="1022.6" font-size="20" font-weight="700" fill="#E2E8F0">DYNAMIXEL</text>
<text x="56" y="1053.2" font-size="17" fill="#D2DAE4">the chip, on the UART bus</text>
<rect x="322.9" y="638.6" width="214.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="656.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">register reads and writes</text>
<rect x="329.6" y="791.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="809.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="361.7" y="943.6" width="136.5" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="961.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">UART transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="870.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="894.1" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="918.7" font-size="17" fill="#A7F3E6">board.</text>
<rect x="32" y="1089" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="1103.6" font-size="16" fill="#9AA6B5">you write</text>
<rect x="152.3" y="1089" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="174.3" y="1103.6" font-size="16" fill="#9AA6B5">this library</text>
<rect x="282.1" y="1089" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="1103.6" font-size="16" fill="#9AA6B5">hardware</text>
<path d="M404.1 1097L434.1 1097" fill="none" stroke="#6C7889" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="1103.6" font-size="16" fill="#9AA6B5">calls</text>
