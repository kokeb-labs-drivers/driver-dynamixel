# The vendor documents this driver was written against (handbook ADR-0019), and where the driver relies on them.
# Never commit a copy of a document: `sha256` identifies the exact file that was used, so a reader can confirm they
# hold the same revision. ROBOTIS publishes the protocol and the servos' control tables as web pages of its e-Manual
# (https://emanual.robotis.com), not as PDFs, so there is no `pdf` link and the pages carry no printed page numbers:
# `page: 1` stands for the web page itself, and the section is the page's own heading. The `sha256` is that of the
# page's HTML as downloaded; the e-Manual changes without a revision mark, so a reader whose hash differs should
# compare the sections named below with the live page before trusting a difference.
#
# The README card, docs/datasheet.md and the "Datasheet" box on each page are generated from this file by
# tools/docs/generators/datasheet.py (`kokeb-docs gen`).
