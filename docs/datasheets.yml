# One row per thing the driver takes from a document: the document's own section names, the driver API that
# implements it, and the docs pages that explain it (file names in docs/). The other families' control tables
# (MX 1.0, MX 2.0, XL430, XL330, XM540, XW) are read from their own e-Manual pages; they are listed in
# docs/control-tables.md with the page each one comes from.
