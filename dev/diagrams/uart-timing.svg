<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Bytes on the DATA line</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Sources: xm430 1 Specifications, p. 1; p2 1.6 Byte to Byte Time, p. 1; p1 1.6</text>
<text x="32" y="124.5" font-size="15" fill="#566070">Byte to Byte Time, p. 1; p2 1.3 DYNAMIXEL Protocol, p. 1; p2 1.4 Half Duplex;</text>
<text x="32" y="146.2" font-size="15" fill="#566070">1.5 Tx, Rx Direction, p. 1.</text>
