<text x="157.2" y="229.7" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">header and reserved</text>
<text x="236.7" y="197.5" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">packet ID</text>
