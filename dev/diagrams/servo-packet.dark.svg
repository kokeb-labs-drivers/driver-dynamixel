<text x="347.9" y="197.5" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">instruction</text>
<text x="32" y="278" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Host</text>
<text x="157.2" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">FF FF FD 00</text>
<text x="236.7" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">ID</text>
<text x="284.3" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Length</text>
<text x="347.9" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">INST</text>
<text x="427.3" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Param 1…N</text>
<text x="506.7" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC</text>
<text x="32" y="326" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Servo</text>
<text x="157.2" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#E2E8F0">FF FF FD 00</text>
<text x="236.7" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">ID</text>
<text x="284.3" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">Length</text>
<text x="347.9" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">0x55</text>
<text x="411.4" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#FDE68A">ERR</text>
<text x="490.8" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">Param 1…N</text>
<text x="570.2" y="325.6" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC</text>
<text x="32" y="369" font-size="17" font-weight="700" fill="#E8EDF3">Values</text>
<text x="32" y="405.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">ID</text>
<text x="608" y="405.4" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">min 0 · max 252</text>
<text x="32" y="425.7" font-size="15" fill="#D2DAE4">Packet ID range, protocol 2.0</text>
<text x="32" y="445.8" font-size="14" fill="#9AA6B5">Datasheet 2.3 Packet ID, p. 1</text>
<text x="32" y="478.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">ID</text>
<text x="608" y="478.3" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 254</text>
<text x="32" y="498.6" font-size="15" fill="#D2DAE4">Broadcast ID: every device executes the packet</text>
<text x="32" y="518.7" font-size="14" fill="#9AA6B5">Datasheet 2.3 Packet ID, p. 1</text>
<text x="32" y="551.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">ID</text>
<text x="608" y="551.2" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">min 0 · max 253</text>
<text x="32" y="571.4" font-size="15" fill="#D2DAE4">Packet ID range, protocol 1.0</text>
<text x="32" y="591.5" font-size="14" fill="#9AA6B5">Datasheet 2.2 Packet ID, p. 1</text>
<text x="32" y="624" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CRC</text>
<text x="608" y="624" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 16 bit</text>
<text x="32" y="644.2" font-size="15" fill="#D2DAE4">Checksum over the header to the last parameter, low byte first</text>
<text x="32" y="664.4" font-size="14" fill="#9AA6B5">Datasheet 2.7 CRC, p. 1</text>
<text x="46" y="718.6" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="739" font-size="15" fill="#E2E8F0">Length counts the instruction, the parameters and the CRC: parameters</text>
<text x="46" y="760.7" font-size="15" fill="#E2E8F0">+ 3. The status packet adds the error byte after the instruction 0x55.</text>
<text x="46" y="782.5" font-size="15" fill="#E2E8F0">Protocol 1.0: header FF FF, no reserved byte, one length byte and a</text>
<text x="46" y="804.2" font-size="15" fill="#E2E8F0">one-byte checksum.</text>
</svg>
