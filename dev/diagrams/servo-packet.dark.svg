<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PROTOCOL 2.0</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Instruction and status packets</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Sources: p2 2.3 Packet ID, p. 1; p1 2.2 Packet ID, p. 1; p2 2.7 CRC, p. 1; p2 2</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Instruction Packet, p. 1; p2 2.4 Length, p. 1; p2 3 Status Packet, p. 1; p1 2</text>
<text x="32" y="146.2" font-size="15" fill="#9AA6B5">Instruction Packet, p. 1.</text>
