<text x="136" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">DYNAMIXEL</text>
<text x="231.9" y="162.8" font-size="12" fill="#E2E8F0">TTL servo</text>
<text x="180" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">Half-duplex line</text>
<text x="180" y="253.4" font-size="13" fill="#D2DAE4">TTL or RS-485, 9600 to 4.5</text>
<text x="180" y="272.2" font-size="13" fill="#D2DAE4">Mbit/s</text>
<text x="524" y="228.6" font-size="15" font-weight="700" fill="#E2E8F0">MCU and control table*</text>
<text x="524" y="253.4" font-size="13" fill="#D2DAE4">ARM Cortex-M3, EEPROM and</text>
<text x="524" y="272.2" font-size="13" fill="#D2DAE4">RAM registers</text>
<text x="868" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">Absolute encoder*</text>
<text x="868" y="253.4" font-size="13" fill="#D2DAE4">12 bit, 360 degrees</text>
<text x="868" y="364.6" font-size="15" font-weight="700" fill="#FDE68A">Motor and gear*</text>
<text x="868" y="389.4" font-size="13" fill="#D2DAE4">coreless motor, 353.5 : 1</text>
<text x="180" y="364.6" font-size="15" font-weight="700" fill="#E2E8F0">Supply</text>
<text x="180" y="389.4" font-size="13" fill="#D2DAE4">10.0 V to 14.8 V</text>
