<text x="608" y="624" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 16 bit</text>
<text x="32" y="644.2" font-size="15" class="fk-f-ink2">Checksum over the header to the last parameter, low byte first</text>
<text x="32" y="664.4" font-size="14" class="fk-f-muted">Datasheet 2.7 CRC, p. 1</text>
<text x="46" y="718.6" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="739" font-size="15" class="fk-f-slate-text">Length counts the instruction, the parameters and the CRC: parameters</text>
<text x="46" y="760.7" font-size="15" class="fk-f-slate-text">+ 3. The status packet adds the error byte after the instruction 0x55.</text>
<text x="46" y="782.5" font-size="15" class="fk-f-slate-text">Protocol 1.0: header FF FF, no reserved byte, one length byte and a</text>
<text x="46" y="804.2" font-size="15" class="fk-f-slate-text">one-byte checksum.</text>
