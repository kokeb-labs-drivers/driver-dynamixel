<svg xmlns="http://www.w3.org/2000/svg" width="640" height="851" viewBox="0 0 640 851" role="img" aria-labelledby="servo-packet-title servo-packet-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="servo-packet-title">Instruction and status packets</title>
<desc id="servo-packet-desc">Field layout of a DYNAMIXEL protocol 2.0 instruction packet and the status packet that answers it: header and reserved byte, packet ID, length, instruction, the status packet's error byte, parameters and CRC.</desc>
